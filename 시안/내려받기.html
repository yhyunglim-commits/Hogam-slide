<meta name="claude:viewport-fit-sides" content="cover">
<title>호감슬라이드 내려받기 시안</title>
<style>
/* 배치: 위 앱의 도구 막대 / 아래 '다른 형식' 창 — 왼쪽 형식, 가운데 고르기, 오른쪽 결과 */
:root{--bg:#F5F5F7;--surface:#fff;--sunken:#F7F7F9;--line:#E1E1E6;--text:#1D1D1F;--text2:#4B4B50;--text3:#6E6E73;--pri:#006FE6;--pri-soft:#E8F2FF;--warn:#FFF4E0;--warn-ink:#7A4A00;--ck1:#fff;--ck2:#D4D4DA;
--sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1E20;--surface:#2A2A2D;--sunken:#252528;--line:#3A3A3E;--text:#F5F5F7;--text2:#C7C7CC;--text3:#A0A0A6;--pri:#2D8FFF;--pri-soft:#173252;--warn:#3D2C12;--warn-ink:#FFCC80;--ck1:#55555B;--ck2:#3A3A3E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E1E20;--surface:#2A2A2D;--sunken:#252528;--line:#3A3A3E;--text:#F5F5F7;--text2:#C7C7CC;--text3:#A0A0A6;--pri:#2D8FFF;--pri-soft:#173252;--warn:#3D2C12;--warn-ink:#FFCC80;--ck1:#55555B;--ck2:#3A3A3E;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:16px}
h1,h2,p{margin:0}h1{font-size:17px}h2{font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.push{margin-left:auto}
.hint{color:var(--text3);font-size:13px}
button{font:500 13px var(--sans);color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:34px;padding:0 13px;cursor:pointer}
button.pri{background:#006FE6;border-color:#006FE6;color:#fff}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#more[aria-expanded=true]{background:var(--pri-soft);border-color:var(--pri)}
.win{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.head,.foot{padding:12px 18px}.head{border-bottom:1px solid var(--line)}.foot{border-top:1px solid var(--line)}
.cols{display:grid;grid-template-columns:190px 270px minmax(0,1fr);min-height:400px}
.cols>*{padding:16px;min-width:0}
.kinds{display:grid;gap:4px;align-content:start;border-right:1px solid var(--line)}
.kinds button{text-align:left;border-color:transparent;background:none;padding:8px 10px}
.kinds button[aria-pressed=true]{background:var(--pri-soft);border-color:var(--pri)}
.kinds small{display:block;color:var(--text3);font-weight:400}
.opts{display:grid;gap:16px;align-content:start}
label.f{display:grid;gap:5px;font-weight:600;font-size:13px}
select,input[type=text]{font:400 14px var(--sans);color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:36px;padding:0 9px;width:100%}
label.c{display:flex;gap:8px;align-items:center}
.out{background:var(--sunken);display:grid;gap:10px;align-content:start}
pre{margin:0;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;max-height:330px;overflow:auto;font:13px/1.55 var(--sans);white-space:pre-wrap}
.tb{overflow:auto;max-height:330px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:pre}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.pics div{display:grid;gap:3px;font-size:12px;color:var(--text2);overflow-wrap:anywhere}
canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:5px}
.clear{background:repeating-conic-gradient(var(--ck2) 0 25%,var(--ck1) 0 50%) 0 0/16px 16px}
.warn{background:var(--warn);color:var(--warn-ink);border-radius:8px;padding:9px 12px;font-size:13px;display:grid;gap:8px;justify-items:start}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}.kinds{border-right:0;border-bottom:1px solid var(--line)}.push{margin-left:0}}
</style>
<div class="wrap">
  <div class="row"><h1>슬라이드 미리보기</h1><span class="hint">시안 · 예시 자료</span>
    <span class="row push"><button disabled>TXT</button><button disabled>PDF</button><button disabled>JPG</button><button disabled>PNG</button><button disabled>PowerPoint</button><button id="more" aria-expanded="true" aria-controls="win">다른 형식…</button></span></div>
  <section class="win" id="win" aria-labelledby="wt">
    <div class="head row"><h2 id="wt">다른 형식으로 내려받기</h2><button class="push" id="x">닫기</button></div>
    <div class="cols"><div class="kinds" id="kinds"></div><div class="opts" id="opts"></div><div class="out" id="out"></div></div>
    <div class="foot row"><span class="hint" id="sum"></span><button class="pri push" id="go">내려받기</button></div>
  </section>
  <p class="hint">시안이라 파일은 안 내려와요. 흐린 단추는 지금 앱에 있는 것으로, 그대로 둬요.</p>
</div>
<script>
const $=i=>document.getElementById(i),E=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S=[['찬양','만복의 근원 하나님',['만복의 근원 하나님','온 백성 찬송 드리고','저 천사여 찬송하세','찬송 성부 성자 성령']],['찬양','만복의 근원 하나님',['아멘']],['찬양','',[]],
['말씀','요한복음 3:16',['하나님이 세상을 이처럼 사랑하사','독생자를 주셨으니']],['말씀','요한복음 3:16',['이는 저를 믿는 자마다','멸망하지 않고 영생을 얻게 하려 하심이라']],['광고','교회 소식',['예배 후 1층에서','새가족 모임이 있습니다 🙏']]];
const K=[['txt','TXT 고르기','한글 방식 · 나누기 · 줄 수'],['png','투명 PNG','배경 없이 글자만'],['tga','투명 TGA','방송 장비용'],['green','초록 배경 PNG','초록을 빼서 얹을 때'],['csv','CSV','표로 읽는 프로그램용']];
const V={enc:'utf8',sep:'blank',mark:'---',n:'0',blank:false,title:true};let k='txt';
let EUC;function euc(){if(EUC)return EUC;EUC=new Set();const d=new TextDecoder('euc-kr');for(let a=0x81;a<0xFF;a++)for(let b=0x41;b<0xFF;b++){const t=d.decode(new Uint8Array([a,b]));if([...t].length===1&&t!=='\ufffd')EUC.add(t);}return EUC;}
const missing=t=>[...new Set([...t].filter(c=>c.codePointAt(0)>127&&!euc().has(c)))];
function rows(){let o=S.filter(s=>V.blank||s[2].length);
  if(k==='txt'&&+V.n)o=o.flatMap(s=>{if(!s[2].length)return[s];const r=[];for(let i=0;i<s[2].length;i+=+V.n)r.push([s[0],s[1],s[2].slice(i,i+ +V.n)]);return r;});return o;}
function text(){let last='';const sep=V.sep==='blank'?'\n\n':`\n${V.mark}\n`;return rows().map(s=>{const t=V.title&&s[1]&&s[1]!==last?s[1]+'\n':'';last=s[1]||last;return t+(s[2].join('\n')||'');}).join(sep);}
const sel=(id,l,o)=>`<label class="f" for="${id}">${l}<select id="${id}">${o.map(([v,t])=>`<option value="${v}"${V[id]===v?' selected':''}>${t}</option>`).join('')}</select></label>`;
const ck=(id,l)=>`<label class="c" for="${id}"><input type="checkbox" id="${id}"${V[id]?' checked':''}>${l}</label>`;
const ENC=[['utf8','UTF-8 (추천)'],['euc','옛 윈도우용 한글']];
const NOTE={png:'사진과 배경색을 빼고 글자·로고만 남겨요. 글자 뒤에 깐 상자는 남아요.',tga:'투명한 그림이에요. 파일이 커서 만드는 데 시간이 걸릴 수 있어요.',green:'송출의 초록 배경과 같은 초록이에요.'};
function opts(){let h='';
  if(k==='txt')h=sel('enc','한글 저장 방식',ENC)+sel('sep','화면 나누기',[['blank','빈 줄'],['mark','기호 직접 적기']])+(V.sep==='mark'?`<label class="f" for="mark">나누는 기호<input type="text" id="mark" maxlength="12" value="${E(V.mark)}"></label>`:'')+sel('n','한 화면 최대 줄 수',[['0','지금 화면 그대로'],['1','1줄'],['2','2줄'],['3','3줄']])+'<p class="hint">줄 수는 내려받는 파일에만 적용돼요.</p>'+ck('title','제목 넣기');
  else if(k==='csv')h=sel('enc','한글 저장 방식',ENC)+'<p class="hint">한 줄에 화면 하나씩이에요.</p>';
  else h=`<p class="hint">${NOTE[k]}</p>`;
  $('opts').innerHTML=h+ck('blank','빈 화면도 넣기');
  for(const el of $('opts').querySelectorAll('select,input')){el.addEventListener(el.type==='text'?'input':'change',()=>{V[el.id]=el.type==='checkbox'?el.checked:el.value;if(el.id==='sep')opts();out();});}}
function draw(c,s){const x=c.getContext('2d'),W=640,H=360;c.width=W;c.height=H;if(k==='green'){x.fillStyle='#00B140';x.fillRect(0,0,W,H);}
  x.fillStyle='#fff';x.strokeStyle='rgba(0,0,0,.6)';x.lineWidth=3;x.lineJoin='round';x.textAlign='center';x.textBaseline='middle';x.font='700 30px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
  s[2].forEach((l,i)=>{const y=H/2+(i-(s[2].length-1)/2)*48;x.strokeText(l,W/2,y);x.fillText(l,W/2,y);});}
function out(){const r=rows(),o=$('out');let t='';$('go').textContent='내려받기';
  if(k==='txt'){t=text();o.innerHTML=`<pre>${E(t)}</pre>`;}
  else if(k==='csv'){t=r.map(s=>s.flat().join('')).join('');o.innerHTML='<div class="tb"><table><thead><tr><th>번호</th><th>순서</th><th>제목</th><th>자막</th></tr></thead><tbody>'+r.map((s,i)=>`<tr><td>${i+1}</td><td>${s[0]}</td><td>${E(s[1])}</td><td>${E(s[2].join('\n'))}</td></tr>`).join('')+'</tbody></table></div>';}
  else{o.innerHTML='<div class="pics"></div>';r.forEach((s,i)=>{const d=document.createElement('div'),c=document.createElement('canvas');if(k!=='green')c.className='clear';draw(c,s);d.append(c,`${String(i+1).padStart(2,'0')}_${(s[1]||'화면').replace(/[\s:]/g,'')}.${k==='tga'?'tga':'png'}`);o.firstChild.append(d);});}
  if((k==='txt'||k==='csv')&&V.enc==='euc'){const m=missing(t);if(m.length){const w=document.createElement('div');w.className='warn';w.innerHTML=`<span>옛 윈도우용 한글에는 없는 글자가 있어요: ${m.map(E).join(' ')}<br>그대로 받으면 ?로 바뀌어요.</span><button id="fix">UTF-8로 바꾸기</button>`;o.prepend(w);$('fix').onclick=()=>{V.enc='utf8';opts();out();};}}
  const img=!['txt','csv'].includes(k);$('sum').textContent=`화면 ${r.length}개 · ${img?'1920×1080 · ZIP 파일 하나':k.toUpperCase()+' 파일 하나'}`;}
K.forEach(([id,t,d])=>{const b=document.createElement('button');b.id='k-'+id;b.innerHTML=`${t}<small>${d}</small>`;b.onclick=()=>{k=id;all();};$('kinds').append(b);});
function all(){K.forEach(q=>$('k-'+q[0]).setAttribute('aria-pressed',q[0]===k));opts();out();}
const show=v=>{$('win').hidden=!v;$('more').setAttribute('aria-expanded',v);};
$('more').onclick=()=>show($('win').hidden);$('x').onclick=()=>{show(false);$('more').focus();};$('go').onclick=()=>$('go').textContent='시안이라 안 내려와요';
all();
</script>
