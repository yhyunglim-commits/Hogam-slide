<style>
/* 배치: 위 주제 탭 한 줄 / 아래는 단계마다 왼쪽 번호와 짧은 말, 오른쪽 같은 크기 그림 */
:root{--bg:#F5F5F7;--surface:#fff;--line:#E1E1E6;--text:#1D1D1F;--text3:#6E6E73;--pri:#0062CC;--soft:#E8F2FF;--bad:#D92D23;--sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1E20;--surface:#2A2A2D;--line:#3F3F44;--text:#F5F5F7;--text3:#A0A0A6;--pri:#64A8FF;--soft:#173252;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E1E20;--surface:#2A2A2D;--line:#3F3F44;--text:#F5F5F7;--text3:#A0A0A6;--pri:#64A8FF;--soft:#173252;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:15px/1.6 var(--sans);padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.push{margin-left:auto}
.hint{color:var(--text3);font-size:13px;margin:0}
button{font:500 14px var(--sans);color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:36px;padding:0 13px;cursor:pointer}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}button.pri{background:#006FE6;border-color:#006FE6;color:#fff}
.win{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 28px 30px}
h1{font-size:19px;margin:0 0 12px}h2{font-size:20px;margin:0 0 8px}dialog h2{margin:18px 0 14px;line-height:1.4}dialog .news ul{margin:0 0 24px;gap:10px}
.toc{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:8px}
.toc button{border:0;background:none;padding:0 11px;color:var(--text3)}.toc button[aria-current=true]{background:var(--soft);color:var(--pri);font-weight:700}
ol{list-style:none;margin:0;padding:0}
ol li{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:center;padding:22px 0}
ol li+li{border-top:1px solid var(--line)}
.say{display:flex;gap:14px;align-items:center;font-size:18px;font-weight:600;line-height:1.4}
.no{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:50%;background:var(--soft);color:var(--pri);font-weight:700;font-size:18px}
.shot{position:relative;aspect-ratio:16/10;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#F5F5F7}.shot img{display:block;width:100%;height:100%}
.mk{position:absolute;border:3px solid #D92D23;border-radius:9px}
.empty{color:var(--text3);padding:40px 0;margin:0}.news ul{margin:6px 0 18px;padding-left:20px;display:grid;gap:6px}.ver{color:var(--text3);font-size:13px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);padding:26px;width:min(440px,calc(100% - 32px))}dialog.wide{width:min(900px,calc(100% - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}dialog img{width:100%;border-radius:8px;display:block;margin-bottom:14px}
.tag{display:inline-block;background:#D92D23;color:#fff;border-radius:6px;padding:2px 9px;font-size:13px;font-weight:600}
@media(max-width:640px){.win{padding:18px 16px}ol li{grid-template-columns:minmax(0,1fr);gap:12px}.wrap>.row .push{margin-left:0}}
</style>

const el=(t,x,c)=>{const e=document.createElement(t);e.textContent=x;if(c)e.className=c;return e;};
function show(i){const k=T[i][0],P=$('page');P.innerHTML='';const L=SHOTS.filter(x=>x.topic===k);
  if(k==='news'){const c=document.querySelector('#dlg .news').cloneNode(true);c.prepend(el('h2','1.0 예배당 화면에 바로 송출해요'));P.append(c);}
  else if(!L.length)P.append(el('p','모양이 정해지면 캡처로 채워요.','empty'));
  else{const o=document.createElement('ol');L.forEach((x,n)=>{const li=document.createElement('li'),say=el('div','','say');say.append(el('span',n+1,'no'),el('span',x.text));const s=el('div','','shot'),im=new Image();im.src=x.src;im.alt=x.text;const m=el('div','','mk');Object.assign(m.style,{left:`calc(${x.m.x}% - 4px)`,top:`calc(${x.m.y}% - 4px)`,width:`calc(${x.m.w}% + 8px)`,height:`calc(${x.m.h}% + 8px)`});s.append(im,m);li.append(say,s);o.append(li);});P.append(o);}
  [...$('toc').children].forEach((b,n)=>b.setAttribute('aria-current',n===i));}
T.forEach((t,i)=>{const b=el('button',t[1]);b.onclick=()=>show(i);$('toc').append(b);});
$('showNews').onclick=()=>$('dlg').showModal();$('nOk').onclick=()=>$('dlg').close();$('nHelp').onclick=()=>{$('dlg').close();show(6);};
