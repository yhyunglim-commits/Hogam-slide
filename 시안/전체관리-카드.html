<title>호감슬라이드 전체 관리 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 위: 숫자 4칸 → 거르기 → 교회 카드(확인 필요가 먼저). 카드를 누르면 오른쪽에서 자세히 */
:root{--canvas:#F5F5F7;--surface:#fff;--sunken:#F2F2F5;--line:#E1E1E6;--text:#1D1D1F;--text2:#4B4B50;--text3:#6E6E73;--pri:#0071EB;--on:#fff;--pri-soft:#E8F2FF;--pri-ink:#0062CC;--ok:#177A3A;--ok-soft:#E3F6E9;--bad:#C9281F;--bad-soft:#FDECEB;--warn:#7A4A00;--warn-soft:#FFF0D6;--bar:#3586F7;--amber:#E88600;--edge:0 0 0 .5px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.05);--dim:rgba(0,0,0,.32);--sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--canvas:#1E1E20;--surface:#2A2A2D;--sunken:#353539;--line:#3A3A3E;--text:#F5F5F7;--text2:#C7C7CC;--text3:#A1A1A8;--pri:#0A6FDB;--pri-soft:#173252;--pri-ink:#7DB6FF;--ok:#5BDD72;--ok-soft:#173A20;--bad:#FF8078;--bad-soft:#3F1D1B;--warn:#FFCC80;--warn-soft:#3D2C12;--bar:#3D9BFF;--amber:#FF9F0A;--edge:0 0 0 .5px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.3);--dim:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--canvas:#1E1E20;--surface:#2A2A2D;--sunken:#353539;--line:#3A3A3E;--text:#F5F5F7;--text2:#C7C7CC;--text3:#A1A1A8;--pri:#0A6FDB;--pri-soft:#173252;--pri-ink:#7DB6FF;--ok:#5BDD72;--ok-soft:#173A20;--bad:#FF8078;--bad-soft:#3F1D1B;--warn:#FFCC80;--warn-soft:#3D2C12;--bar:#3D9BFF;--amber:#FF9F0A;--edge:0 0 0 .5px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.3);--dim:rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--text);font:15px/1.5 var(--sans);word-break:keep-all;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.wrap{max-width:1320px;margin:auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.wrap>*{min-width:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
h1{font-size:24px;line-height:1.25;margin:0}
.fake{padding:4px 10px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600}
.sum{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:14px;box-shadow:var(--edge)}
.sum div{padding:14px 18px;border-left:1px solid var(--line)}.sum div:first-child{border:0}
.sum span{display:block;font-size:13px;color:var(--text3)}.sum b{font-size:24px;line-height:1.3}.sum small{font-size:13px;color:var(--text3);margin-left:4px}
.tools{display:flex;flex-wrap:wrap;gap:10px}
.tools input{flex:1 1 220px;max-width:340px;min-width:0}
input,textarea,select{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%}
textarea{height:110px;padding:10px 12px;resize:vertical}
.seg{display:flex;padding:3px;border-radius:11px;background:var(--sunken);border:1px solid var(--line)}
.seg button{border:0;background:none;min-height:34px;padding:0 13px;border-radius:8px;color:var(--text2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--edge)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:13px;padding:18px;border:0;border-radius:16px;background:var(--surface);box-shadow:var(--edge);text-align:left;min-width:0}
.card:hover{box-shadow:0 0 0 1.5px var(--pri)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.top b{font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--text3);display:block}
.tag{flex:none;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--ok-soft);color:var(--ok)}.tag.w{background:var(--warn-soft);color:var(--warn)}.tag.b{background:var(--bad-soft);color:var(--bad)}.tag.n{background:var(--sunken);color:var(--text2)}.tag.p{background:var(--pri-soft);color:var(--pri-ink)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.facts span{font-size:12px;color:var(--text3);display:block}.facts b{font-size:15px;color:var(--text)}
.m{display:grid;gap:4px;font-size:13px}.m>span{display:flex;justify-content:space-between;gap:8px;color:var(--text2)}
.tr{height:6px;border-radius:9px;background:var(--sunken);overflow:hidden;display:block}.tr i{display:block;height:100%;border-radius:9px;background:var(--bar)}.tr i.hi{background:var(--amber)}
.need{margin-top:auto;padding:8px 11px;border-radius:10px;background:var(--sunken);color:var(--text3);font-size:13px}.need.w{background:var(--warn-soft);color:var(--warn);font-weight:600}
.empty{padding:50px 10px;text-align:center;color:var(--text3);grid-column:1/-1}
dialog{margin:0 0 0 auto;width:min(560px,100%);height:100%;max-height:none;max-width:none;border:0;padding:0;background:var(--canvas);color:var(--text)}
dialog::backdrop{background:var(--dim)}
.sheet{padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.sheet>*{min-width:0}
.sh{display:flex;gap:12px;align-items:center}.sh h2{font-size:21px;line-height:1.3;margin:0;flex:1;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(6,1fr)}.tabs button{padding:0 4px}
.box{background:var(--surface);border-radius:14px;box-shadow:var(--edge);padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 0;border-top:1px solid var(--line)}.row:first-child{border:0}
.row>span{flex:1;min-width:0}.row>b{font-weight:600;text-align:right;overflow-wrap:anywhere}.row input[type=number]{width:92px;text-align:right}.row select{width:auto}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri)}
.btn{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:500;white-space:nowrap}.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on)}.btn.bad{color:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.note{margin:0;font-size:13px;color:var(--text2);padding:10px 12px;background:var(--pri-soft);border-radius:10px}
h3{margin:4px 0 -8px;font-size:14px;color:var(--text2)}
.bars{display:flex;align-items:flex-end;gap:5px;height:90px;padding-top:12px}.bars i{flex:1;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.ax{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);padding:5px 0 12px}
.form{display:grid;gap:10px;padding-block:14px}.form label{display:grid;gap:4px;font-size:13px;color:var(--text2)}
#toast{position:sticky;bottom:12px;margin:0;padding:10px 14px;border-radius:10px;background:var(--text);color:var(--canvas);font-size:14px}
@media(max-width:700px){.sum{grid-template-columns:1fr 1fr}.sum div{padding:12px 14px}.sum div:nth-child(3){border-left:0}.sum div:nth-child(n+3){border-top:1px solid var(--line)}.tools input{max-width:none;flex-basis:100%}.seg{flex:1}.seg button{flex:1;padding:0 6px}.tabs{grid-template-columns:repeat(3,1fr)}}
</style>
<div class="wrap">
<header><h1>전체 관리</h1><span class="fake">시안 · 모두 가짜 자료</span></header>
<section class="sum" id="sum" aria-label="전체 요약"></section>
<div class="tools"><input id="q" type="search" placeholder="교회 이름 찾기" aria-label="교회 이름 찾기"><div class="seg" id="flt" role="group" aria-label="거르기"></div></div>
<main class="grid" id="grid"></main>
</div>
<dialog id="dlg" aria-labelledby="dt"><div class="sheet"><div class="sh"><h2 id="dt"></h2><button class="btn" id="cls">닫기</button></div><div class="seg tabs" id="tabs" role="group" aria-label="교회 관리"></div><div id="pane" style="display:grid;gap:16px"></div><p id="toast" role="status" hidden></p></div></dialog>
<script>
// n 이름, p 요금제, s 상태, m 팀원, last 며칠 전, ai 이번 달 AI, al 한도, mb 용량, ml 한도, sv 예배, sg 곡, need 확인할 일
const D=[
{n:'예시 푸른숲교회',p:'무료',s:'사용 중',m:8,last:0,ai:120,al:300,mb:40,ml:200,sv:31,sg:214,at:'2026. 9. 2.',mail:'admin@example.com',need:''},
{n:'예시 새빛교회',p:'기본',s:'사용 중',m:14,last:1,ai:962,al:1000,mb:312,ml:1000,sv:58,sg:430,at:'2026. 8. 11.',mail:'team@example.com',need:'AI를 한도의 96% 썼어요'},
{n:'예시 한마음교회',p:'기본',s:'사용 중',m:6,last:3,ai:88,al:1000,mb:120,ml:1000,sv:20,sg:150,at:'2026. 10. 5.',mail:'hello@example.com',need:'이용 기한이 5일 남았어요'},
{n:'예시 작은샘교회',p:'무료',s:'사용 중',m:2,last:46,ai:0,al:300,mb:6,ml:200,sv:3,sg:11,at:'2026. 10. 1.',mail:'',need:'46일 동안 쓰지 않았어요'},
{n:'예시 시냇가교회',p:'무료',s:'사용 중',m:5,last:2,ai:54,al:300,mb:33,ml:200,sv:17,sg:96,at:'2026. 10. 20.',mail:'church@example.com',need:''},
{n:'예시 들꽃교회',p:'무료',s:'쉬는 중',m:4,last:70,ai:0,al:300,mb:18,ml:200,sv:8,sg:42,at:'2026. 8. 30.',mail:'flower@example.com',need:''},
{n:'예시 소망언덕교회',p:'기본',s:'사용 중',m:11,last:0,ai:410,al:1000,mb:240,ml:1000,sv:44,sg:318,at:'2026. 9. 14.',mail:'hope@example.com',need:''}];
const $=i=>document.getElementById(i),day=d=>d?d+'일 전':'오늘',f=n=>n.toLocaleString('ko');
let flt='전체',cur,tab='정보';
const total=k=>D.reduce((a,c)=>a+c[k],0);
$('sum').innerHTML=[['전체 교회',D.length,'곳'],['이번 주 쓴 교회',D.filter(c=>c.last<7).length,'곳'],['이번 달 AI',f(total('ai')),'번'],['확인 필요',D.filter(c=>c.need).length,'곳']].map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join('');
const meter=(l,v,x,u)=>`<span class="m"><span><span>${l}</span><span>${f(v)} / ${f(x)}${u}</span></span><span class="tr"><i class="${v/x>=.8?'hi':''}" style="width:${Math.min(100,v/x*100)}%"></i></span></span>`;
const tag=c=>`<span class="tag ${c.s==='쉬는 중'?'n':''}">${c.s}</span>`;
function draw(){const F={전체:()=>1,'확인 필요':c=>c.need,'쉬는 중':c=>c.s==='쉬는 중'};
$('flt').innerHTML=Object.keys(F).map(k=>`<button aria-pressed="${k===flt}" data-k="${k}">${k} ${D.filter(F[k]).length}</button>`).join('');
const L=D.filter(c=>F[flt](c)&&c.n.includes($('q').value.trim())).sort((a,b)=>!!b.need-!!a.need||a.last-b.last);
$('grid').innerHTML=L.map(c=>`<button class="card" data-i="${D.indexOf(c)}"><span class="top"><span><b>${c.n}</b><span class="sub">${c.p} 요금제</span></span>${tag(c)}</span><span class="facts"><span>팀원<br><b>${c.m}명</b></span><span>예배<br><b>${c.sv}개</b></span><span>마지막 사용<br><b>${day(c.last)}</b></span></span>${meter('이번 달 AI',c.ai,c.al,'번')}${meter('용량',c.mb,c.ml,'MB')}<span class="need ${c.need?'w':''}">${c.need||'확인할 일 없음'}</span></button>`).join('')||'<p class="empty">맞는 교회가 없어요</p>';}
$('flt').onclick=e=>{const b=e.target.closest('button');if(b){flt=b.dataset.k;draw();}};$('q').oninput=draw;
$('grid').onclick=e=>{const b=e.target.closest('.card');if(b){cur=D[b.dataset.i];tab='정보';pane();$('dlg').showModal();}};
$('cls').onclick=()=>$('dlg').close();$('dlg').onclick=e=>{if(e.target===$('dlg'))$('dlg').close();};
const row=(a,b)=>`<div class="row"><span>${a}</span>${b}</div>`,v=t=>`<b>${t}</b>`,box=h=>`<div class="box">${h}</div>`,stage=t=>`<p class="note">${t}</p>`;
const btn=(t,c='')=>`<button class="btn ${c}" data-say="${t}">${t}</button>`;
const P={
정보:c=>box(row('상태',tag(c))+row('만든 날',v(c.at))+row('담당자',v('예시담당'))+row('연락 이메일',v(c.mail||'아직 없음'))+row('예배 · 곡',v(`${c.sv}개 · ${c.sg}곡`)))+`<h3>호감 메모</h3><textarea id="memo" aria-label="호감 메모" placeholder="호감만 보는 메모"></textarea><div class="acts">${btn('메모 저장','pri')}${btn(c.s==='쉬는 중'?'다시 열기':'교회 멈추기','bad')}</div>`+stage('예배와 곡의 내용은 호감에게도 보이지 않아요.'),
사용:c=>{const w=[3,5,2,8,4,7,10,2,4,6,3,9,7,12],s=w.reduce((a,b)=>a+b),k=w.map(x=>Math.round(c.ai*.6*x/s));return box(meterBox(c))+'<h3>최근 14일 AI 사용</h3>'+box(`<div class="bars" role="img" aria-label="최근 14일 AI 사용, 가장 많은 날 ${Math.max(...k)}번">${k.map(x=>`<i style="height:${x/Math.max(1,...k)*100}%" title="${x}번"></i>`).join('')}</div><div class="ax"><span>14일 전</span><span>가장 많은 날 ${Math.max(...k)}번</span><span>오늘</span></div>`)+'<h3>용량이 쓰인 곳</h3>'+box([['배경 사진 · 로고',.6],['예배',.2],['곡',.12],['편집 기록',.08]].map(x=>row(x[0],v((c.mb*x[1]).toFixed(1)+'MB'))).join(''));},
팀원:c=>box(Array.from({length:Math.min(c.m,5)},(_,i)=>row(`예시팀원${i+1} ${i?'':'<span class="tag p">관리자</span>'}<span class="sub">${i?'2026. 10. '+(i+3)+'.':c.at} 들어옴</span>`,btn('관리','')) ).join('')+(c.m>5?row(`그 밖에 ${c.m-5}명`,''):''))+'<h3>로그인 도움</h3>'+box(row('모든 기기에서 로그아웃<span class="sub">휴대폰을 잃어버렸을 때</span>',btn('로그아웃'))+row('새 카카오 계정으로 자리 옮기기<span class="sub">카카오 계정이 바뀌었을 때</span>',btn('옮기기')))+stage('카카오 로그인은 우리에게 비밀번호가 없어서, 초기화 대신 이 두 가지로 도와요. 로그인 도움은 나 단계에서 만들어요.'),
제한:c=>stage('나 단계에서 만들어요.')+box(row('한 달 AI 횟수',`<input id="l1" aria-label="한 달 AI 횟수" type="number" value="${c.al}">`)+row('팀원 수',`<input id="l2" aria-label="팀원 수" type="number" value="30">`)+row('용량(MB)',`<input id="l3" aria-label="용량" type="number" value="${c.ml}">`))+'<h3>쓸 수 있는 기능</h3>'+box(['악보 사진 읽기','주보 사진 읽기','새 팀원 초대','PPTX · PDF 내려받기'].map((x,i)=>row(`<label for="k${i}">${x}</label>`,`<input id="k${i}" type="checkbox" checked>`)).join(''))+`<div class="acts">${btn('제한 저장','pri')}</div><h3>호감이 바꾼 기록</h3>`+box(row('AI 횟수 200 → '+c.al+'<span class="sub">2026. 11. 20.</span>','')),
요금:c=>stage('라 단계에서 만들어요. 카드 정보는 저장하지 않아요. 처음에는 호감이 직접 적어요.')+box(row('요금제',`<select id="pl" aria-label="요금제"><option>무료</option><option ${c.p==='기본'?'selected':''}>기본</option></select>`)+row('시작일',v(c.at))+row('만료일',v(c.p==='무료'?'없음':'2026. 11. 29.'))+row('결제 상태',v(c.p==='무료'?'해당 없음':'입금 확인')))+'<h3>결제 내역</h3>'+box(c.p==='무료'?row('아직 없음',''):row('10월 이용료<span class="sub">2026. 10. 29.</span>',v('입금 확인')))+`<div class="acts">${btn('요금 저장','pri')}</div>`,
소통:c=>stage('다 단계에서 만들어요. 관리자가 연락 이메일을 직접 적고 동의한 교회에만 보내요.')+box(`<div class="form"><label>받는 곳<input id="to" readonly value="${c.mail||'연락 이메일이 아직 없어요'}"></label><label>제목<input id="ti" placeholder="제목"></label><label>내용<textarea id="bo" placeholder="내용"></textarea></label><div class="acts"><button class="btn pri" data-say="메일 보내기" ${c.mail?'':'disabled'}>메일 보내기</button></div></div>`)+'<h3>주고받은 기록</h3>'+box(row('이용 안내<span class="sub">2026. 11. 3. 보냄</span>',v('읽음 모름')))};
function meterBox(c){return `<div class="form">${meter('이번 달 AI',c.ai,c.al,'번')}${meter('용량',c.mb,c.ml,'MB')}</div>`;}
function pane(){$('dt').textContent=cur.n;$('toast').hidden=true;$('tabs').innerHTML=Object.keys(P).map(k=>`<button aria-pressed="${k===tab}" data-t="${k}">${k}</button>`).join('');$('pane').innerHTML=P[tab](cur);}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;pane();}};
$('pane').onclick=e=>{const b=e.target.closest('[data-say]');if(b){$('toast').textContent='시안이라 실제로 바뀌지 않아요: '+b.dataset.say;$('toast').hidden=false;}};
draw();
</script>
