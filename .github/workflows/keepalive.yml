# Supabase 무료 프로젝트가 7일 동안 쓰이지 않으면 잠들어요.
# 사흘마다 한 번 데이터베이스를 살짝 깨워 둡니다. (config.js에 적은 주소와 공개 키를 씁니다)
name: keep-supabase-awake
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ping
        run: |
          URL=$(grep -oE "SUPABASE_URL *: *['\"][^'\"]+" config.js | sed -E "s/.*['\"]//")
          KEY=$(grep -oE "SUPABASE_ANON_KEY *: *['\"][^'\"]+" config.js | sed -E "s/.*['\"]//")
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
